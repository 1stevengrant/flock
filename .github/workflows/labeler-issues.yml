# Issues opened by people without repository access need a maintainer's first review.
name: Issue Triage

on:
    issues:
        types: [ opened ]

permissions:
    issues: write

jobs:
    label:
        name: Label for triage
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/github-script@v9
                with:
                    #language=javascript
                    script: |
                        const { owner, repo } = context.repo;
                        const issue = context.payload.issue;
                        const author = issue.user.login;

                        if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association) || issue.user.type === 'Bot') {
                            core.info(`${author} is a repository collaborator or bot`);
                            return;
                        }

                        // An org member whose membership is private shows up as a CONTRIBUTOR above; what they
                        // may do in the repository says who they are.
                        const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: author });
                        if (['admin', 'write'].includes(access.permission)) {
                            core.info(`${author} has ${access.permission} access`);
                            return;
                        }

                        await github.rest.issues.addLabels({
                            owner,
                            repo,
                            issue_number: issue.number,
                            labels: ['needs triage'],
                        });
                        core.info(`Added "needs triage" to #${issue.number}, opened by ${author}`);
